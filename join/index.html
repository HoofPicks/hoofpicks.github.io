<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoof Picks — Join a Group Draw</title>
<meta name="description" content="Enter your code to claim a number and watch the winner get revealed — right in your browser, no app required.">

<meta property="og:type" content="website">
<meta property="og:title" content="Hoof Picks — Join a Group Draw">
<meta property="og:description" content="Enter your code to claim a number and watch the winner get revealed — right in your browser, no app required.">
<meta property="og:image" content="https://hoofpicks.github.io/join/og-image.png">
<meta property="og:url" content="https://hoofpicks.github.io/join/">
<meta name="twitter:card" content="summary_large_image">

<style>
  :root {
    --bg: #0B2A1B;
    --surface: #123524;
    --surface-2: #1A4330;
    --accent: #D6A84F;
    --text: #F5F0E6;
    --text-muted: #B9C9BE;
    --danger: #E0A05B;
    --border: #2A4A38;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .brand img { width: 44px; height: 44px; border-radius: 11px; display: block; }
  .brand h1 { font-size: 20px; margin: 0; color: var(--accent); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .muted { color: var(--text-muted); font-size: 14px; }
  .title { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .sub { font-size: 14px; color: var(--text-muted); margin: 0 0 18px; }

  .code-form { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    padding: 12px 14px;
    letter-spacing: 0.04em;
  }
  input[type="text"]::placeholder { color: var(--text-muted); }
  button {
    background: var(--accent);
    color: #1A1203;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    background: var(--surface-2);
  }
  .row.taken { opacity: 0.9; }
  .row.mine { border-color: var(--accent); }
  .row.winner { border-color: var(--accent); background: #22361f; }
  .row .num { font-weight: 700; font-size: 16px; min-width: 34px; }
  .row .label { flex: 1; font-size: 14px; color: var(--text-muted); }
  .row .you-tag {
    font-size: 11px; font-weight: 700; color: #1A1203;
    background: var(--accent); border-radius: 999px; padding: 2px 8px;
  }
  .row .winner-tag {
    font-size: 11px; font-weight: 700; color: #1A1203;
    background: var(--accent); border-radius: 999px; padding: 2px 8px;
  }
  .claim-form { display: flex; gap: 8px; flex: 1; }
  .claim-form input { padding: 8px 10px; font-size: 14px; }
  .claim-form button { padding: 8px 12px; font-size: 13px; }
  .tap-claim { background: none; border: none; color: var(--accent); font-weight: 700; font-size: 13px; cursor: pointer; }

  .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .winner-box { text-align: center; padding: 20px 10px; }
  .winner-box .num { font-size: 56px; font-weight: 800; color: var(--accent); line-height: 1; }
  .winner-box .label { font-size: 16px; color: var(--text-muted); margin-top: 6px; }
  .disclaimer { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 24px; line-height: 1.5; }
  .get-app { font-size: 13px; }
  .get-app a { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="icon.png" style="width:44px;height:44px;" alt="">
      <h1>Hoof Picks</h1>
    </div>
    <div id="app"></div>
    <p class="disclaimer">Entertainment utility only — not a gambling app. Hoof Picks does not sell lottery tickets, accept wagers, or guarantee winnings, and is not affiliated with any lottery.</p>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
